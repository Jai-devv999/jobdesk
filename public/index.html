<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Job Desk Tim</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b4cca'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Job Desk</h1>
  <span id="modeBadge" class="badge" hidden>Mode dev</span>
  <div class="user">
    <button id="userBtn" class="icon-btn" type="button" aria-label="Masuk mode dev" aria-haspopup="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
    </button>
    <div id="userMenu" class="dropdown" hidden>
      <button id="logoutBtn" type="button">Keluar dari mode dev</button>
    </div>
  </div>
</header>

<nav id="tabs" class="tabs" aria-label="Kategori job desk"></nav>

<main>
  <div id="catTools" class="cat-tools" hidden>
    <button id="renameCat" type="button">Ganti nama kategori</button>
    <button id="deleteCat" type="button" class="danger">Hapus kategori</button>
  </div>

  <form id="addForm" class="add" hidden autocomplete="off">
    <input id="inName" type="text" placeholder="Nama" maxlength="60" required aria-label="Nama">
    <input id="inTask" type="text" placeholder="Tugas" maxlength="300" required aria-label="Tugas">
    <button class="primary" type="submit">Tambah tugas</button>
  </form>

  <p id="summary" class="summary"></p>
  <ul id="list" class="list"></ul>
  <p id="empty" class="empty" hidden></p>
</main>

<dialog id="loginDlg">
  <form id="loginForm" autocomplete="off">
    <h2>Masuk mode dev</h2>
    <p class="hint">Hanya dev yang bisa menambah dan mengubah tugas.</p>
    <input id="pw" type="password" placeholder="Password dev" maxlength="200" required aria-label="Password dev" autocomplete="current-password">
    <p id="loginErr" class="err" role="alert" hidden></p>
    <div class="row">
      <button type="button" id="loginCancel">Batal</button>
      <button type="submit" class="primary">Masuk</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>
<script src="app.js" defer></script>
</body>
</html>
